<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev Anything</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>Jev Anything</strong><span>GTK fixture / Linux AT-SPI</span><output id="connection">CONNECTING</output></header><main>
<form id="controls"><label for="goal">目标</label><input id="goal" value="Enable dark mode"><select id="fixture" aria-label="GUI 场景"><option value="preferences">Preferences</option><option value="home">Smart home</option><option value="support">Support inbox</option><option value="memory">Memory review</option><option value="tasks">Task board</option><option value="tictactoe">Tic-Tac-Toe</option></select><select id="provider" aria-label="决策模型"><option value="jev">Jev 1.13</option><option value="rule">Rule baseline</option></select><select id="scenario" aria-label="测试场景"><option value="normal">正常执行</option><option value="stale">状态过期</option></select><button id="run">运行</button><button type="button" id="pause">暂停执行</button><button type="button" id="reset">重置</button><button type="button" id="replay">回看记录</button></form>
<div class="views"><section><h2>GUI <span id="freshness">WAITING</span></h2><img id="gui" alt="Linux GTK 实时窗口" src="/api/gui.png"></section><section><h2>GUI2TUI <span id="state">READY</span></h2><pre id="terminal"></pre></section></div>
<div class="details"><section><h2>决策 <span id="model">—</span></h2><pre id="decision">等待决策</pre><h2>候选</h2><div id="candidates"></div></section><section><h2>执行流程 <span id="traceid">—</span></h2><ol id="trace"></ol></section></div>
<details><summary>完整事件</summary><pre id="raw"></pre></details></main><script src="/app.js"></script></body></html>
