[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-anything"
version = "0.1.0"
description = "Jev decision adapter for GUI semantic workflows"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
jev-anything-workbench = "jev_anything.server:main"

[tool.setuptools.packages.find]
where = ["src"]
